<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@400;600;700;800&display=swap"><link rel="stylesheet" href="/assets/style.css"><title>Panel · Meridad</title>
<style>
body{display:block;padding:0}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.top .logo{width:40px;height:40px}
.top h1{font-size:24px;margin:0;flex:1 1 auto}
.top select,.top .btn{min-height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font:700 14px var(--sans);padding:0 12px;cursor:pointer;width:auto;margin:0}
.top .btn.primary{background:var(--salvia);color:var(--on);border-color:var(--salvia)}
.stamp{font-size:12.5px;color:var(--muted);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,calc(50% - 6px)),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 16px}
.kpi .k{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font:600 28px/1.2 var(--serif);margin-top:4px}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.kpi.good .v{color:var(--salvia)}.kpi.bad .v{color:var(--danger)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:18px}
.panel h2{margin:0 0 10px;font-size:19px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px}
.two .panel{margin-bottom:0}.panel,.kpi,.two>*{min-width:0}.kpi .v{overflow-wrap:anywhere}.kpi .v small{font:700 14px var(--sans);color:var(--muted)}html,body{overflow-x:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.warn td{background:color-mix(in srgb,var(--danger) 9%,transparent)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:800}
.b-active{background:color-mix(in srgb,var(--salvia) 18%,transparent);color:var(--salvia)}
.b-trial{background:var(--tint);color:var(--ink)}
.b-expired{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.alerts li{margin:6px 0}
.search{width:100%;max-width:320px;min-height:40px;margin:0 0 10px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font:11px var(--sans);fill:var(--muted)}
.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.settings label{margin:0 0 4px}.settings input{min-height:40px;width:130px}
.center{max-width:440px;margin:12vh auto 0;text-align:center}
.note{font-size:12.5px;color:var(--muted)}
tbody tr.link{cursor:pointer}tbody tr.link:hover td{background:var(--tint)}
.back{background:none;border:0;color:var(--salvia);font:800 15px var(--sans);padding:0;width:auto;min-height:40px;margin:0;cursor:pointer}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:4px 0 16px}.who h2{margin:0;font-size:22px;overflow-wrap:anywhere}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const SUPABASE_URL = 'https://nnwnctzmpcxrckonensk.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ud25jdHptcGN4cmNrb25lbnNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwOTg4MzcsImV4cCI6MjEwNzY3NDgzN30.DUjcY1x4z4K2v9hjoFODdPjzmAFLxR0mbqhfFHKHJks'; // clave pública (anon): la seguridad la da la función del servidor, que solo responde a los correos de administración
const REDIRECT = location.origin + '/admin/';
const $app = document.getElementById('app');
const FEATURES = { tutor: 'Tutor', quizGeneration: 'Crear quiz', quizGrading: 'Corregir quiz', cardProposal: 'Tarjetas',
  transcription: 'Transcribir escritura', queryExpansion: 'Búsqueda (ampliar)', rerank: 'Búsqueda (ordenar)', studyExtraction: 'Textos de estudio',
  photoText: 'Foto a texto', actions: 'Acciones', learnerReport: 'Perfil del estudiante', attentive: 'Tutor atento', drawing: 'Dibujos',
  lab: 'Laboratorio', unknown: 'Sin dato (versión 1.0)' };
const STATUS = { active: 'Suscrito', trial: 'Prueba', expired: 'Vencido' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const usd = n => { n = Number(n || 0); return '$' + (n < 1 && n > 0 ? n.toFixed(4) : n.toFixed(2)); };
const int = n => Number(n || 0).toLocaleString('es');
const date = s => s ? new Date(s).toLocaleDateString('es', { day: '2-digit', month: 'short', year: '2-digit' }) : '—';
function ago(s) {
  if (!s) return 'nunca';
  const m = (Date.now() - new Date(s)) / 60000;
  if (m < 2) return 'ahora'; if (m < 60) return `hace ${Math.round(m)} min`;
  if (m < 1440) return `hace ${Math.round(m / 60)} h`; return `hace ${Math.round(m / 1440)} d`;
}
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
const sess = { get(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (_) {} } };

// Sesión: Google por Supabase; el token vuelve en el fragmento de la URL y se guarda solo en esta pestaña.
const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
if (hash.get('access_token')) { sess.set('at', hash.get('access_token')); sess.set('rt', hash.get('refresh_token')); }
if (location.hash) history.replaceState(null, '', location.pathname);

function signIn() { location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(REDIRECT)}`; }
function signOut() { sess.set('at', null); sess.set('rt', null); gate('Sesión cerrada.'); }
async function refresh() {
  const rt = sess.get('rt'); if (!rt) return false;
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: ANON_KEY, 'content-type': 'application/json' }, body: JSON.stringify({ refresh_token: rt }) });
  if (!r.ok) return false;
  const j = await r.json(); sess.set('at', j.access_token); sess.set('rt', j.refresh_token); return true;
}
function gate(msg) {
  $app.innerHTML = `<div class="card center"><img class="logo" src="/assets/logo.png" alt="Meridad"><h1>Panel de Meridad</h1>
    <p class="muted">${esc(msg || 'Solo para la cuenta de administración.')}</p><button id="g">Entrar con Google</button></div>`;
  document.getElementById('g').onclick = signIn;
}

// Verificación en dos pasos (TOTP): sin el código de 6 dígitos de una app de autenticación, el servidor no entrega datos.
const authAPI = (path, opts = {}) => fetch(SUPABASE_URL + '/auth/v1' + path,
  { ...opts, headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + sess.get('at'), 'content-type': 'application/json' } });
async function mfa() {
  const r = await authAPI('/user');
  if (!r.ok) return gate('Tu sesión terminó. Vuelve a entrar.');
  const factors = ((await r.json()).factors || []).filter(f => f.factor_type === 'totp');
  const ready = factors.find(f => f.status === 'verified');
  if (ready) return codeForm(ready.id, null);
  // Un intento anterior sin terminar se descarta y se empieza de nuevo.
  for (const f of factors) await authAPI('/factors/' + f.id, { method: 'DELETE' });
  const e = await authAPI('/factors', { method: 'POST', body: JSON.stringify({ factor_type: 'totp', friendly_name: 'Panel Meridad', issuer: 'Meridad' }) });
  if (!e.ok) return gate('No se pudo preparar la verificación en dos pasos. Inténtalo de nuevo.');
  const j = await e.json();
  codeForm(j.id, j.totp);
}
function codeForm(factorId, totp) {
  $app.innerHTML = `<div class="card center"><img class="logo" src="/assets/logo.png" alt="Meridad">
    <h1>${totp ? 'Activa la verificación en dos pasos' : 'Código de verificación'}</h1>
    ${totp ? `<p class="muted">Solo la primera vez. Abre una app de autenticación (Google Authenticator, Microsoft Authenticator, Authy o la de Contraseñas del iPhone) y escanea este código.</p>
      <img src="${esc(totp.qr_code.startsWith('data:') ? totp.qr_code : 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(totp.qr_code))}" alt="Código QR para la app de autenticación" style="width:200px;height:200px;background:#fff;border-radius:12px;padding:8px;margin:8px auto;display:block">
      <p class="note">¿No puedes escanearlo? Escribe esta clave en la app:<br><code style="user-select:all;word-break:break-all">${esc(totp.secret)}</code></p>`
      : '<p class="muted">Escribe el código de 6 dígitos que muestra tu app de autenticación.</p>'}
    <form id="f"><label for="code">Código de 6 dígitos</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <p class="err" id="err" role="alert"></p><button id="go" type="submit">Verificar</button></form>
    <footer><a href="#" id="other">Entrar con otra cuenta</a></footer></div>`;
  const code = document.getElementById('code'); code.focus();
  document.getElementById('other').onclick = e => { e.preventDefault(); signOut(); };
  document.getElementById('f').onsubmit = async e => {
    e.preventDefault();
    const go = document.getElementById('go'), err = document.getElementById('err');
    go.disabled = true; err.textContent = '';
    try {
      const c = await authAPI(`/factors/${factorId}/challenge`, { method: 'POST', body: '{}' });
      if (!c.ok) throw new Error('challenge');
      const v = await authAPI(`/factors/${factorId}/verify`, { method: 'POST', body: JSON.stringify({ challenge_id: (await c.json()).id, code: code.value.trim() }) });
      if (!v.ok) { err.textContent = 'Código incorrecto o vencido. Escribe el que aparece ahora.'; go.disabled = false; code.select(); return; }
      const j = await v.json(); sess.set('at', j.access_token); sess.set('rt', j.refresh_token);
      load();
    } catch (_) { err.textContent = 'No se pudo verificar. Revisa tu conexión.'; go.disabled = false; }
  };
}

let state = { days: store.get('days', 30), sort: store.get('sort', ['last_seen', -1]), q: '', data: null,
  price: store.get('price', 9.99), fee: store.get('fee', 15), user: null, detail: null };

async function load(retry = true) {
  if (!sess.get('at')) return gate();
  $app.querySelector('#stamp')?.replaceChildren('Cargando…');
  let r;
  const extra = state.user ? `&user=${state.user}` : '';
  try { r = await fetch(`${SUPABASE_URL}/functions/v1/admin-stats?days=${state.days}${extra}`, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + sess.get('at') } }); }
  catch (_) { return gate('Sin conexión. Revisa tu red e inténtalo de nuevo.'); }
  if (r.status === 401 && retry && await refresh()) return load(false);
  if (r.status === 401) return gate('Tu sesión terminó. Vuelve a entrar.');
  if (r.status === 403) {
    const j = await r.json().catch(() => ({}));
    if (j.error?.type === 'mfa_required') return mfa();
    sess.set('at', null); sess.set('rt', null); return gate('Esta cuenta no tiene acceso al panel.');
  }
  if (!r.ok) return gate('No se pudo leer el panel. Inténtalo en un momento.');
  if (r.status === 404 && state.user) { state.user = null; return load(); }
  if (state.user) { state.detail = await r.json(); return renderUser(); }
  state.data = await r.json(); render();
}

function bars(series, key, fmt, color) {
  const w = 720, h = 170, pad = 26, n = series.length || 1, bw = (w - pad) / n;
  const max = Math.max(...series.map(d => Number(d[key])), key === 'cost' ? 0.01 : 1);
  const rects = series.map((d, i) => { const v = Number(d[key]); const bh = (h - 30) * v / max;
    return `<rect x="${pad + i * bw + 1}" y="${h - 18 - bh}" width="${Math.max(bw - 2, 1)}" height="${bh}" rx="2" fill="${color}"><title>${esc(d.day)}: ${fmt(v)}</title></rect>`; }).join('');
  const labels = series.filter((_, i) => i % Math.ceil(n / 6) === 0).map(d => { const i = series.indexOf(d);
    return `<text x="${pad + i * bw}" y="${h - 4}">${new Date(d.day + 'T12:00:00').toLocaleDateString('es', { day: '2-digit', month: 'short' })}</text>`; }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" role="img"><text x="0" y="12">${fmt(max)}</text><line x1="${pad}" x2="${w}" y1="${h - 18}" y2="${h - 18}" stroke="var(--border)"/>${rects}${labels}</svg>`;
}

function render() {
  const d = state.data, o = d.overview, days = d.days;
  const net = state.price * (1 - state.fee / 100);
  const revenue = o.subscribed * net; // al mes
  const cost30 = Number(o.cost_period) * 30 / days; // proyección a 30 días
  const margin = revenue - cost30;
  const perUser30 = u => Number(u.period_cost) * 30 / days;
  const soon = Date.now() + 2 * 864e5;
  const alerts = [
    ...d.users.filter(u => u.daily_cost_usd && Number(u.today_cost) >= 0.8 * Number(u.daily_cost_usd))
      .map(u => `<b>${esc(u.email)}</b> usó hoy ${usd(u.today_cost)} de su tope de ${usd(u.daily_cost_usd)}.`),
    ...d.users.filter(u => u.status === 'active' && perUser30(u) > net)
      .map(u => `<b>${esc(u.email)}</b> cuesta ~${usd(perUser30(u))}/mes y deja ${usd(net)}: <b>pierdes dinero</b> con esta cuenta.`),
    ...d.users.filter(u => u.status === 'trial' && u.trial_ends_at && new Date(u.trial_ends_at) < soon)
      .map(u => `La prueba de <b>${esc(u.email)}</b> termina ${date(u.trial_ends_at)} (última conexión ${ago(u.last_seen)}).`),
  ];
  d.users.forEach(u => u.cap = u.daily_cost_usd ? Math.round(100 * Number(u.today_cost) / Number(u.daily_cost_usd)) : 0);
  const q = state.q.toLowerCase();
  const [sk, sd] = state.sort;
  const value = (u, k) => { const v = u[k]; if (v == null) return null; if (typeof v === 'number') return v;
    if (/^-?\d+(\.\d+)?$/.test(v)) return Number(v); if (/^\d{4}-\d{2}-\d{2}/.test(v)) return Date.parse(v); return String(v).toLowerCase(); };
  const users = d.users.filter(u => !q || (u.email || '').toLowerCase().includes(q)).sort((a, b) => {
    const x = value(a, sk), y = value(b, sk);
    if (x == null || y == null) return (x == null) - (y == null); // sin dato, al final
    return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y))) * sd;
  });
  const cols = [['email', 'Correo'], ['created_at', 'Alta'], ['status', 'Estado'], ['trial_ends_at', 'Prueba / renueva'], ['last_seen', 'Última conexión'],
    ['today_calls', 'Llamadas hoy', 1], ['today_cost', 'USD hoy', 1], ['cap', '% tope hoy', 1], ['period_calls', `Llamadas ${days} d`, 1],
    ['period_tokens', `Tokens ${days} d`, 1], ['period_images', `Dibujos ${days} d`, 1], ['period_cost', `USD ${days} d`, 1], ['total_cost', 'USD total', 1]];
  const kpi = (k, v, s = '', cls = '') => `<div class="kpi ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  $app.innerHTML = `
  <div class="top"><img class="logo" src="/assets/logo.png" alt=""><h1>Panel de Meridad</h1>
    <select id="days" aria-label="Periodo">${[7, 30, 90].map(n => `<option value="${n}" ${n === days ? 'selected' : ''}>Últimos ${n} días</option>`).join('')}</select>
    <button class="btn primary" id="reload">Actualizar</button><button class="btn" id="csv">Exportar CSV</button><button class="btn" id="out">Salir</button>
    <div class="stamp" id="stamp">Actualizado ${new Date(d.generated_at).toLocaleString('es')} · hora local</div></div>
  <div class="grid">
    ${kpi('Usuarios', int(o.users), `+${int(o.new_7)} en 7 días · +${int(o.new_30)} en 30`)}
    ${kpi('Activos', `${int(o.active_1)} / ${int(o.active_7)} / ${int(o.active_30)}`, 'hoy / 7 días / 30 días')}
    ${kpi('Planes', `${int(o.subscribed)} · ${int(o.trial)} · ${int(o.expired)}`, 'suscritos · en prueba · vencidos')}
    ${kpi('Conversión', o.users ? Math.round(100 * o.ever_subscribed / o.users) + '%' : '—', `${int(o.ever_subscribed)} han pagado alguna vez`)}
    ${kpi('Gasto IA hoy', usd(o.cost_today), `7 días: ${usd(o.cost_7)}`)}
    ${kpi(`Gasto IA ${days} días`, usd(o.cost_period), `≈ ${usd(cost30)} al mes · total ${usd(o.cost_total)}`)}
    ${kpi('Ingreso estimado', usd(revenue) + '<small>/mes</small>', `${int(o.subscribed)} × ${usd(net)} neto`)}
    ${kpi('Margen estimado', usd(margin) + '<small>/mes</small>', 'ingreso − gasto proyectado', margin >= 0 ? 'good' : 'bad')}
  </div>
  ${alerts.length ? `<div class="panel"><h2>Alertas</h2><ul class="alerts">${alerts.map(a => `<li>${a}</li>`).join('')}</ul></div>` : ''}
  <div class="two">
    <div class="panel chart"><h2>Gasto diario de IA (USD)</h2>${bars(d.series, 'cost', usd, 'var(--salvia)')}</div>
    <div class="panel chart"><h2>Usuarios que usaron la IA por día</h2>${bars(d.series, 'active', int, 'var(--strong)')}</div>
  </div><div style="height:18px"></div>
  <div class="two">
    <div class="panel"><h2>Por función (${days} días)</h2><div class="scroll"><table><thead><tr><th>Función</th><th class="num">Llamadas</th><th class="num">USD</th></tr></thead><tbody>
      ${d.features.map(f => `<tr><td>${esc(FEATURES[f.feature] || f.feature)}</td><td class="num">${int(f.calls)}</td><td class="num">${usd(f.cost)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sin uso</td></tr>'}
    </tbody></table></div></div>
    <div class="panel"><h2>Por modelo (${days} días)</h2><div class="scroll"><table><thead><tr><th>Modelo</th><th class="num">Llamadas</th><th class="num">Tokens</th><th class="num">USD</th></tr></thead><tbody>
      ${d.models.map(m => `<tr><td>${esc(m.model)}</td><td class="num">${int(m.calls)}</td><td class="num">${int(m.tokens)}</td><td class="num">${usd(m.cost)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin uso</td></tr>'}
    </tbody></table></div></div>
  </div><div style="height:18px"></div>
  <div class="panel"><h2>Usuarios</h2>
    <input class="search" id="q" placeholder="Buscar por correo" value="${esc(state.q)}">
    <div class="scroll"><table><thead><tr>${cols.map(([k, t, n]) => `<th data-k="${k}" class="${n ? 'num' : ''}">${t}${k === sk ? (sd > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>
    ${users.map(u => `<tr data-u="${esc(u.id)}" title="Ver el detalle" class="link ${u.cap >= 80 || (u.status === 'active' && perUser30(u) > net) ? 'warn' : ''}">
      <td>${esc(u.email)}${u.account === 'blocked' ? ' <span class="badge b-expired">bloqueada</span>' : ''}</td><td>${date(u.created_at)}</td>
      <td><span class="badge b-${esc(u.status)}">${STATUS[u.status] || esc(u.status)}</span></td>
      <td>${u.status === 'active' ? (u.renews_at ? 'renueva ' + date(u.renews_at) : '—') : u.status === 'trial' ? 'termina ' + date(u.trial_ends_at) : '—'}</td>
      <td title="${esc(u.last_seen)}">${ago(u.last_seen)}</td>
      <td class="num">${int(u.today_calls)}</td><td class="num">${usd(u.today_cost)}</td><td class="num">${u.cap}%</td>
      <td class="num">${int(u.period_calls)}</td><td class="num">${int(u.period_tokens)}</td><td class="num">${int(u.period_images)}</td>
      <td class="num">${usd(u.period_cost)}</td><td class="num">${usd(u.total_cost)}</td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="panel"><h2>Supuestos del cálculo</h2><div class="settings">
    <div><label for="price">Precio mensual (USD)</label><input id="price" type="number" step="0.01" min="0" value="${state.price}"></div>
    <div><label for="fee">Comisión de Apple (%)</label><input id="fee" type="number" step="1" min="0" max="50" value="${state.fee}"></div>
  </div><p class="note">El ingreso es una estimación: suscritos activos × precio neto. Apple cobra 15 % en el Small Business Program (30 % si no estás inscrito). «Última conexión» es lo más reciente entre el inicio de sesión, la renovación de la sesión al abrir la app y la última llamada de IA. Solo metadatos: el panel nunca ve notas. Las cuentas borradas desaparecen con su historial de uso.</p></div>`;
  const el = id => document.getElementById(id);
  el('days').onchange = e => { state.days = Number(e.target.value); store.set('days', state.days); load(); };
  el('reload').onclick = () => load();
  el('out').onclick = signOut;
  el('csv').onclick = () => {
    const keys = ['email', 'created_at', 'status', 'trial_ends_at', 'renews_at', 'last_seen', 'today_calls', 'today_cost', 'period_calls', 'period_tokens', 'period_images', 'period_cost', 'total_calls', 'total_tokens', 'total_images', 'total_cost'];
    const csv = [keys.join(','), ...d.users.map(u => keys.map(k => `"${String(u[k] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `meridad-usuarios-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  };
  el('q').oninput = e => { state.q = e.target.value; render(); const i = el('q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k; state.sort = [k, state.sort[0] === k ? -state.sort[1] : -1]; store.set('sort', state.sort); render(); });
  ['price', 'fee'].forEach(id => el(id).onchange = e => { state[id] = Number(e.target.value) || 0; store.set(id, state[id]); render(); });
  document.querySelectorAll('tr[data-u]').forEach(tr => tr.onclick = () => openUser(tr.dataset.u));
}

function openUser(id) { state.user = id; state.detail = null; scrollTo(0, 0); load(); }
function closeUser() { state.user = null; state.detail = null; render(); scrollTo(0, 0); }

// Ficha de un usuario: todo su gasto (solo metadatos; nunca el contenido de lo que preguntó).
function renderUser() {
  const u = state.data?.users.find(x => x.id === state.user) || {}, d = state.detail, days = d.days;
  const net = state.price * (1 - state.fee / 100);
  const sum = k => d.series.reduce((a, x) => a + Number(x[k] || 0), 0);
  const cost = sum('cost'), cost30 = cost * 30 / days;
  const kpi = (k, v, s = '', cls = '') => `<div class="kpi ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const balance = u.status === 'active' ? net - cost30 : null;
  const cap = u.daily_cost_usd ? Math.round(100 * Number(u.today_cost) / Number(u.daily_cost_usd)) : 0;
  const when = s => new Date(s).toLocaleString('es', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  $app.innerHTML = `
  <div class="top"><img class="logo" src="/assets/logo.png" alt=""><h1>Panel de Meridad</h1>
    <select id="days" aria-label="Periodo">${[7, 30, 90].map(n => `<option value="${n}" ${n === days ? 'selected' : ''}>Últimos ${n} días</option>`).join('')}</select>
    <button class="btn primary" id="reload">Actualizar</button><button class="btn" id="csv">Exportar llamadas</button><button class="btn" id="out">Salir</button></div>
  <button class="back" id="back">← Todos los usuarios</button>
  <div class="who"><h2>${esc(u.email || state.user)}</h2><span class="badge b-${esc(u.status)}">${STATUS[u.status] || esc(u.status || '')}</span>
    <span class="note">Alta ${date(u.created_at)} · ${u.status === 'active' ? (u.renews_at ? 'renueva ' + date(u.renews_at) : 'suscrito') : u.status === 'trial' ? 'prueba hasta ' + date(u.trial_ends_at) : 'sin plan'} · última conexión ${ago(u.last_seen)}</span></div>
  <div class="grid">
    ${kpi(`Gasto ${days} días`, usd(cost), `≈ ${usd(cost30)} al mes`)}
    ${kpi('Gasto total', usd(u.total_cost), `${int(u.total_calls)} llamadas · ${int(u.total_images)} dibujos`)}
    ${kpi(`Llamadas ${days} días`, int(sum('calls')), `${int(sum('tokens'))} tokens`)}
    ${kpi(`Dibujos ${days} días`, int(sum('images')))}
    ${kpi('Hoy', usd(u.today_cost), `${cap}% de su tope de ${usd(u.daily_cost_usd)}`, cap >= 80 ? 'bad' : '')}
    ${balance === null ? kpi('Balance', '—', 'no paga (prueba o vencido)') : kpi('Balance', usd(balance) + '<small>/mes</small>', `paga ${usd(net)} neto − gasta ~${usd(cost30)}`, balance >= 0 ? 'good' : 'bad')}
  </div>
  <div class="two">
    <div class="panel chart"><h2>Gasto por día (USD)</h2>${bars(d.series, 'cost', usd, 'var(--salvia)')}</div>
    <div class="panel chart"><h2>Llamadas por día</h2>${bars(d.series, 'calls', int, 'var(--strong)')}</div>
  </div><div style="height:18px"></div>
  <div class="two">
    <div class="panel"><h2>Por función (${days} días)</h2><div class="scroll"><table><thead><tr><th>Función</th><th class="num">Llamadas</th><th class="num">Tokens</th><th class="num">USD</th></tr></thead><tbody>
      ${d.features.map(f => `<tr><td>${esc(FEATURES[f.feature] || f.feature)}</td><td class="num">${int(f.calls)}</td><td class="num">${int(f.tokens)}</td><td class="num">${usd(f.cost)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin uso</td></tr>'}
    </tbody></table></div></div>
    <div class="panel"><h2>Por modelo (${days} días)</h2><div class="scroll"><table><thead><tr><th>Modelo</th><th class="num">Llamadas</th><th class="num">Tokens</th><th class="num">USD</th></tr></thead><tbody>
      ${d.models.map(m => `<tr><td>${esc(m.model)}</td><td class="num">${int(m.calls)}</td><td class="num">${int(m.tokens)}</td><td class="num">${usd(m.cost)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">Sin uso</td></tr>'}
    </tbody></table></div></div>
  </div><div style="height:18px"></div>
  <div class="panel"><h2>Últimas llamadas</h2><p class="note">Las ${d.events.length} más recientes (hasta 200). Solo metadatos: no se guarda qué preguntó ni qué respondió la IA.</p>
    <div class="scroll"><table><thead><tr><th>Fecha</th><th>Función</th><th>Modelo</th><th class="num">Entrada</th><th class="num">Salida</th><th class="num">Caché</th><th class="num">Búsquedas</th><th class="num">USD</th></tr></thead><tbody>
    ${d.events.map(e => `<tr><td>${when(e.created_at)}</td><td>${e.kind === 'image' ? 'Dibujo (imagen)' : e.feature === 'drawing' ? 'Dibujo (preparar y nombres)' : esc(FEATURES[e.feature] || e.feature)}</td><td>${esc(e.model)}</td>
      <td class="num">${int(e.input_tokens)}</td><td class="num">${int(e.output_tokens)}</td><td class="num">${int(Number(e.cache_read_tokens) + Number(e.cache_write_tokens))}</td>
      <td class="num">${int(e.web_searches)}</td><td class="num">${usd(e.cost)}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Sin llamadas</td></tr>'}
    </tbody></table></div></div>`;
  const el = id => document.getElementById(id);
  el('back').onclick = closeUser;
  el('days').onchange = e => { state.days = Number(e.target.value); store.set('days', state.days); load(); };
  el('reload').onclick = () => load();
  el('out').onclick = signOut;
  el('csv').onclick = () => {
    const keys = ['created_at', 'feature', 'model', 'kind', 'input_tokens', 'output_tokens', 'cache_read_tokens', 'cache_write_tokens', 'web_searches', 'cost'];
    const csv = [keys.join(','), ...d.events.map(e => keys.map(k => `"${String(e[k] ?? '').replace(/"/g, '""')}"`).join(','))].join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `meridad-llamadas-${(u.email || 'usuario').replace(/[^a-z0-9]+/gi, '-')}.csv`; a.click();
  };
}

load();
setInterval(() => { if ((state.data || state.detail) && document.visibilityState === 'visible') load(); }, 5 * 60 * 1000);
</script></body></html>
